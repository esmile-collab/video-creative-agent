<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Creative Agent</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-badge">VCA</div>
          <div>
            <p class="eyebrow">脚本生成工作台</p>
            <h1>Video Creative Agent</h1>
          </div>
        </div>

        <div class="sidebar-card">
          <h2>怎么写效果好</h2>
          <ul>
            <li>说清楚这条视频拍给谁看</li>
            <li>卖点和事实尽量具体，每行一条</li>
            <li>生成后会自动检查结构是否可用</li>
          </ul>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <p class="eyebrow">公开版演示</p>
            <h2>脚本生成</h2>
          </div>
          <button id="use-demo" class="secondary-button" type="button">填充示例</button>
        </header>

        <form id="brief-form" class="brief-form">
          <div class="form-grid">
            <label>
              <span>项目标题</span>
              <input name="title" placeholder="例如：AI 工作流入门" required />
            </label>
            <label>
              <span>脚本类型</span>
              <select name="scriptType">
                <option value="knowledge_explainer" selected>知识讲解</option>
                <option value="product_education">产品种草</option>
                <option value="case_breakdown">案例拆解</option>
              </select>
            </label>
          </div>

          <label>
            <span>目标受众</span>
            <textarea name="audience" rows="2" placeholder="这条视频拍给谁看？例如：刚接触 AI 的非技术创作者" required></textarea>
          </label>

          <label>
            <span>核心产品</span>
            <input name="product" placeholder="这条视频围绕的产品或服务是什么？" required />
          </label>

          <label>
            <span>产品卖点</span>
            <span class="hint">最想让观众记住的亮点，每行一条</span>
            <textarea name="sellingPoints" rows="3" placeholder="例如：无需 API Key，本地就能跑通完整流程"></textarea>
          </label>

          <label>
            <span>核心事实</span>
            <span class="hint">关于产品可以确定的事实依据（功能、参数、真实信息），每行一条，脚本只会在这些事实范围内展开</span>
            <textarea name="coreFacts" rows="4" placeholder="例如：整个流程分为写需求、生成脚本、生成分镜、自动校验四个步骤"></textarea>
          </label>

          <label>
            <span>想表达的内容</span>
            <textarea name="keyMessage" rows="3" placeholder="这条视频最想传达什么？希望观众看完明白什么、去做什么？" required></textarea>
          </label>

          <label>
            <span>不能说的内容（可选）</span>
            <span class="hint">不希望脚本里出现的说法，每行一条</span>
            <textarea name="forbiddenClaims" rows="3" placeholder="例如：不承诺收入、流量等效果数字"></textarea>
          </label>

          <div class="actions">
            <button type="submit" class="primary-button">生成脚本</button>
            <button type="button" class="ghost-button" id="reset-form">清空</button>
          </div>
        </form>

        <section id="result-panel" class="result-panel hidden">
          <div class="result-header">
            <div>
              <p class="eyebrow">生成结果</p>
              <h3>脚本与分镜</h3>
            </div>
            <div id="status-tag" class="status-tag">生成中</div>
          </div>

          <div class="summary-grid" id="summary-grid"></div>

          <div class="output-card">
            <h4>脚本正文</h4>
            <pre id="script-output"></pre>
          </div>

          <div class="output-card">
            <h4>分镜概览</h4>
            <pre id="storyboard-output"></pre>
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
