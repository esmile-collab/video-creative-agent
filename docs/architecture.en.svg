<svg xmlns="http://www.w3.org/2000/svg" width="960" height="912" viewBox="0 0 960 912" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Video Creative Agent — system architecture and feedback loops</title>
<desc id="desc">A script-to-storyboard system with review and revision loops。Brief &amp; inputs：Strategy · facts；Recall &amp; compile：Hard filters · Top-1；Script &amp; shots：Script → shot plan；Evaluate：Fidelity · timing · fields；Record findings：Failures · warnings；Revise &amp; rerun：Edit inputs or rules；Reusable inputs &amp; regression cases：Strategy cards · confirmed scripts · tests/；Review materials：JSON / Markdown。The demo uses a mock provider; the real-model adapter needs explicit integration. Public code covers scripts and storyboards. Auto-repair and final video composition are not wired.</desc>
