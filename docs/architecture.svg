<title id="title">视频创意 Agent：系统架构与反馈闭环</title>
<desc id="desc">从策略到分镜，把评测问题带回下一次修改。简报与策略输入：Brief · 策略卡 · 事实；策略召回与编译：硬过滤 · Top-1 召回；脚本与分镜：确认脚本 → 分镜规划；结构校验与评测：口播 · 时序 · 画面字段；评测问题留痕：阻断项 · 警告 · 摘要；人工纠错与重跑：修改脚本或分镜规则；可复用输入与回归用例：策略卡 · 确认脚本 · tests/；分镜与审阅材料：JSON / Markdown。默认 Demo 使用 Mock；兼容模型适配器需显式接入。 当前公开代码覆盖脚本与分镜；自动纠错和成片合成尚未接入。</desc>
